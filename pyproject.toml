[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'weather-analytics'
version = '0.1.0'
description = 'Weather monitoring and analytics service powered by Open-Meteo'
readme = 'README.md'
requires-python = '>=3.12,<3.13'
dependencies = [
    'httpx>=0.27,<1',
    'pydantic>=2.8,<3',
    'pydantic-settings>=2.5,<3',
    'psycopg[binary]>=3.2,<4',
    'streamlit>=1.66,<2',
    'pandas>=2.2,<3',
    'altair>=5,<7',
    'python-telegram-bot>=22.8,<23.0',
    'pymorphy3>=2.0.6,<3.0',
    'pymorphy3-dicts-ru>=2.4.417150',
    'sqlalchemy>=2.0,<3',
    'alembic>=1.14,<2',
]

[project.optional-dependencies]
dev = [
    'pytest>=8,<10',
    'pytest-mock>=3.14,<4',
    'ruff>=0.9,<1',
    'mypy>=1.11,<2',
    'pandas-stubs>=3.0,<4',
]

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length = 88
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.12'
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = ['pymorphy3', 'pymorphy3.*']
follow_untyped_imports = true
